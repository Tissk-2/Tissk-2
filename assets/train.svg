<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240" role="img" aria-label="A train riding a rainbow rail through a neon nebula past a ringed planet">
  <defs>
    <radialGradient id="nebA" cx="80%" cy="90%" r="65%">
      <stop offset="0" stop-color="#ff6ec4" stop-opacity=".7"/>
      <stop offset=".55" stop-color="#7873f5" stop-opacity=".35"/>
      <stop offset="1" stop-color="#140b2e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebB" cx="12%" cy="15%" r="55%">
      <stop offset="0" stop-color="#4adede" stop-opacity=".45"/>
      <stop offset="1" stop-color="#140b2e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planet" cx="35%" cy="30%" r="80%">
      <stop offset="0" stop-color="#ffe3f3"/>
      <stop offset=".45" stop-color="#ff9ad5"/>
      <stop offset="1" stop-color="#6b3fb8"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" x2="1">
      <stop offset="0" stop-color="#4adede" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#4adede" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" x2="1">
      <stop offset="0" stop-color="#7873f5" stop-opacity="0"/>
      <stop offset=".3" stop-color="#4adede"/>
      <stop offset=".6" stop-color="#ff6ec4"/>
      <stop offset=".85" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="ahead" x1="0" x2="1">
      <stop offset="0" stop-color="#ffd166" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffd166" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="flare">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".25" stop-color="#ffd166" stop-opacity=".95"/>
      <stop offset="1" stop-color="#ff6ec4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b3b8f"/>
      <stop offset="1" stop-color="#21184a"/>
    </linearGradient>
    <linearGradient id="loco" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8fd0"/>
      <stop offset="1" stop-color="#b0307c"/>
    </linearGradient>
    <clipPath id="disk"><circle cx="420" cy="96" r="62"/></clipPath>
  </defs>

  <style>
    .star { animation: twinkle 3s ease-in-out infinite; }
    .d1 { animation-delay: -.7s; } .d2 { animation-delay: -1.5s; } .d3 { animation-delay: -2.2s; }
    .rock { animation: drift linear infinite; }
    .train { animation: bob 4s ease-in-out infinite; }
    .spark { animation: spark 1.6s linear infinite; }
    .flare { transform-box: fill-box; transform-origin: center; animation: pulse 2s ease-in-out infinite; }
    .shoot { animation: shoot 7s ease-in infinite; }
    .win { animation: blink 3s steps(1) infinite; }
    .w2 { animation-delay: -1s; } .w3 { animation-delay: -2s; }
    @keyframes twinkle { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
    @keyframes drift { from { transform: translate(0, 0) rotate(0); } to { transform: translate(-900px, 120px) rotate(-200deg); } }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes spark { 0% { opacity: 0; transform: translate(0, 0); } 15% { opacity: 1; } 100% { opacity: 0; transform: translate(-320px, 14px); } }
    @keyframes pulse { 0%, 100% { opacity: .8; transform: scale(.9); } 50% { opacity: 1; transform: scale(1.15); } }
    @keyframes shoot { 0%, 80% { opacity: 0; transform: translate(0, 0); } 83% { opacity: 1; } 100% { opacity: 0; transform: translate(-260px, 90px); } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
    /* ponytail: reduced motion freezes the scene as a still frame */
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .shoot { opacity: 0; } }
  </style>

  <rect width="800" height="240" rx="16" fill="#140b2e"/>
  <rect width="800" height="240" rx="16" fill="url(#nebB)"/>
  <rect width="800" height="240" rx="16" fill="url(#nebA)"/>

  <!-- colored stars -->
  <circle class="star" cx="40" cy="28" r="1.6" fill="#ffd166"/><circle class="star d1" cx="120" cy="70" r="1.3" fill="#4adede"/>
  <circle class="star d2" cx="210" cy="20" r="1.8" fill="#ff6ec4"/><circle class="star d3" cx="300" cy="48" r="1.2" fill="#ffffff"/>
  <circle class="star d1" cx="560" cy="18" r="1.7" fill="#4adede"/><circle class="star d2" cx="640" cy="60" r="1.3" fill="#ffd166"/>
  <circle class="star d3" cx="720" cy="30" r="2" fill="#ff6ec4"/><circle class="star" cx="770" cy="84" r="1.3" fill="#ffffff"/>
  <circle class="star d2" cx="80" cy="140" r="1.2" fill="#ff6ec4"/><circle class="star d1" cx="180" cy="196" r="1.5" fill="#ffd166"/>
  <path class="star d3" d="M690 110 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 l6 -2 z" fill="#ffd166"/>
  <path class="star d1" d="M150 30 l1.5 4.5 l4.5 1.5 l-4.5 1.5 l-1.5 4.5 l-1.5 -4.5 l-4.5 -1.5 l4.5 -1.5 z" fill="#4adede"/>

  <!-- shooting star -->
  <g class="shoot"><line x1="640" y1="10" x2="690" y2="-8" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/></g>

  <!-- ringed planet -->
  <ellipse cx="420" cy="96" rx="104" ry="20" fill="none" stroke="url(#ring)" stroke-width="5" transform="rotate(-12 420 96)" opacity=".9"/>
  <circle cx="420" cy="96" r="62" fill="url(#planet)"/>
  <circle cx="448" cy="118" r="62" fill="#2a1260" opacity=".35" clip-path="url(#disk)"/>
  <path d="M316 118 A104 20 -12 0 0 524 74" fill="none" stroke="url(#ring)" stroke-width="5" transform="rotate(0)" opacity=".9"/>

  <!-- asteroids -->
  <g>
    <path class="rock" fill="#ff9ad5" style="animation-duration:38s;animation-delay:-2s" d="M820 120 l7 -4 l6 3 l1 7 l-6 5 l-8 -2 z"/>
    <path class="rock" fill="#4adede" style="animation-duration:46s;animation-delay:-9s" d="M840 150 l4 -3 l4 2 l0 5 l-5 2 z"/>
    <path class="rock" fill="#a59cff" style="animation-duration:34s;animation-delay:-14s" d="M860 100 l9 -5 l8 4 l2 9 l-8 6 l-10 -3 z"/>
    <path class="rock" fill="#ffd166" style="animation-duration:52s;animation-delay:-21s" d="M830 175 l3 -2 l3 2 l-1 4 l-4 0 z"/>
    <path class="rock" fill="#ff9ad5" style="animation-duration:40s;animation-delay:-27s" d="M850 135 l6 -3 l5 3 l0 6 l-6 3 l-5 -3 z"/>
    <path class="rock" fill="#a59cff" style="animation-duration:44s;animation-delay:-33s" d="M825 200 l5 -3 l5 3 l-1 5 l-6 1 z"/>
    <path class="rock" fill="#4adede" style="animation-duration:36s;animation-delay:-5s" d="M870 165 l4 -2 l4 3 l-2 4 l-5 -1 z"/>
    <path class="rock" fill="#ffd166" style="animation-duration:48s;animation-delay:-17s" d="M845 90 l3 -2 l3 2 l-1 3 l-4 0 z"/>
    <path class="rock" fill="#ff9ad5" style="animation-duration:42s;animation-delay:-38s" d="M835 215 l7 -4 l6 4 l-1 7 l-8 1 z"/>
  </g>

  <!-- rail and train, drawn flat then tilted into a climb -->
  <g transform="translate(470 150) rotate(-14)">
    <rect x="-560" y="9" width="776" height="16" rx="8" fill="url(#trail)" opacity=".35"/>
    <rect x="-560" y="15" width="776" height="4" fill="url(#trail)"/>
    <rect x="200" y="17" width="260" height="2" fill="url(#ahead)"/>

    <g transform="translate(60 4) scale(1.5)">
      <circle class="spark" fill="#ffd166" cx="-60" cy="18" r="1.6"/>
      <circle class="spark" fill="#ff6ec4" cx="-60" cy="14" r="1.2" style="animation-delay:-.3s"/>
      <circle class="spark" fill="#4adede" cx="-60" cy="22" r="1.3" style="animation-delay:-.6s"/>
      <circle class="spark" fill="#ffffff" cx="-60" cy="12" r="1" style="animation-delay:-.9s"/>
      <circle class="spark" fill="#ffd166" cx="-60" cy="20" r="1.8" style="animation-delay:-1.2s"/>
      <circle class="spark" fill="#ff6ec4" cx="40" cy="19" r="1.4" style="animation-delay:-.15s"/>
      <circle class="spark" fill="#4adede" cx="40" cy="13" r="1.1" style="animation-delay:-.75s"/>
      <circle class="spark" fill="#ffd166" cx="40" cy="23" r="1.2" style="animation-delay:-1.35s"/>
      <circle class="spark" fill="#ff6ec4" cx="140" cy="17" r="1.5" style="animation-delay:-.45s"/>
      <circle class="spark" fill="#4adede" cx="140" cy="21" r="1.1" style="animation-delay:-1.05s"/>
      <circle class="spark" fill="#ffffff" cx="140" cy="15" r="1.3" style="animation-delay:-1.5s"/>
    </g>

    <g class="train">
      <g fill="url(#body)" stroke="#a59cff" stroke-width="1.2">
        <rect x="-330" y="-6" width="104" height="20" rx="4"/>
        <rect x="-222" y="-6" width="104" height="20" rx="4"/>
        <rect x="-114" y="-6" width="104" height="20" rx="4"/>
        <rect x="-6" y="-6" width="104" height="20" rx="4"/>
      </g>
      <!-- stripe along the carriages -->
      <rect x="-330" y="9" width="428" height="2" fill="#ffd166" opacity=".8"/>
      <g>
        <rect class="win" fill="#4adede" x="-320" y="-1" width="12" height="6" rx="1"/><rect class="win w2" fill="#ffd166" x="-298" y="-1" width="12" height="6" rx="1"/><rect class="win w3" fill="#ff9ad5" x="-276" y="-1" width="12" height="6" rx="1"/><rect class="win" fill="#4adede" x="-254" y="-1" width="12" height="6" rx="1"/>
        <rect class="win w2" fill="#ff9ad5" x="-212" y="-1" width="12" height="6" rx="1"/><rect class="win w3" fill="#4adede" x="-190" y="-1" width="12" height="6" rx="1"/><rect class="win" fill="#ffd166" x="-168" y="-1" width="12" height="6" rx="1"/><rect class="win w2" fill="#4adede" x="-146" y="-1" width="12" height="6" rx="1"/>
        <rect class="win w3" fill="#ffd166" x="-104" y="-1" width="12" height="6" rx="1"/><rect class="win" fill="#ff9ad5" x="-82" y="-1" width="12" height="6" rx="1"/><rect class="win w2" fill="#4adede" x="-60" y="-1" width="12" height="6" rx="1"/><rect class="win w3" fill="#ffd166" x="-38" y="-1" width="12" height="6" rx="1"/>
        <rect class="win" fill="#4adede" x="4" y="-1" width="12" height="6" rx="1"/><rect class="win w2" fill="#ff9ad5" x="26" y="-1" width="12" height="6" rx="1"/><rect class="win w3" fill="#ffd166" x="48" y="-1" width="12" height="6" rx="1"/><rect class="win" fill="#4adede" x="70" y="-1" width="12" height="6" rx="1"/>
      </g>
      <path d="M102 -12 h70 l46 14 l-6 12 h-110 z" fill="url(#loco)" stroke="#ffd166" stroke-width="1.4"/>
      <rect x="112" y="-6" width="26" height="8" rx="1.5" fill="#4adede"/>
      <path d="M150 -12 h22 l46 14 h-20 z" fill="#ffd166" opacity=".45"/>
      <circle class="flare" cx="214" cy="2" r="20" fill="url(#flare)"/>
    </g>
  </g>
</svg>
