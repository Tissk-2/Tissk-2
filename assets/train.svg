<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240" role="img" aria-label="A train riding a glowing rail through space past a pale planet and drifting asteroids">
  <defs>
    <radialGradient id="haze" cx="78%" cy="85%" r="70%">
      <stop offset="0" stop-color="#5b5bd6" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#2a2f7a" stop-opacity=".35"/>
      <stop offset="1" stop-color="#0a0f24" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planet" cx="35%" cy="35%" r="75%">
      <stop offset="0" stop-color="#c9d6e2"/>
      <stop offset=".6" stop-color="#7d93a8"/>
      <stop offset="1" stop-color="#2b3a4d"/>
    </radialGradient>
    <linearGradient id="trail" x1="0" x2="1">
      <stop offset="0" stop-color="#c084fc" stop-opacity="0"/>
      <stop offset=".35" stop-color="#e9b85a" stop-opacity=".7"/>
      <stop offset="1" stop-color="#fff1c4" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="ahead" x1="0" x2="1">
      <stop offset="0" stop-color="#fff1c4" stop-opacity=".8"/>
      <stop offset="1" stop-color="#fff1c4" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="flare">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".25" stop-color="#ffe9a8" stop-opacity=".9"/>
      <stop offset="1" stop-color="#8fb4ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4256"/>
      <stop offset="1" stop-color="#151a28"/>
    </linearGradient>
  </defs>

  <style>
    .star { fill: #e8ecff; animation: twinkle 4s ease-in-out infinite; }
    .d1 { animation-delay: -1s; } .d2 { animation-delay: -2s; } .d3 { animation-delay: -3s; }
    .rock { fill: #8a93b8; animation: drift linear infinite; }
    .train { animation: bob 5s ease-in-out infinite; }
    .spark { fill: #ffe9a8; animation: spark 1.8s linear infinite; }
    .flare { transform-box: fill-box; transform-origin: center; animation: pulse 2.5s ease-in-out infinite; }
    .win { fill: #9ff3f0; }
    @keyframes twinkle { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
    @keyframes drift { from { transform: translate(0, 0); } to { transform: translate(-900px, 120px); } }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes spark { 0% { opacity: 0; transform: translateX(0); } 15% { opacity: 1; } 100% { opacity: 0; transform: translateX(-320px); } }
    @keyframes pulse { 0%, 100% { opacity: .75; transform: scale(.9); } 50% { opacity: 1; transform: scale(1.1); } }
    /* ponytail: reduced motion freezes the scene as a still frame */
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .spark { opacity: .6; } }
  </style>

  <rect width="800" height="240" rx="14" fill="#0a0f24"/>
  <rect width="800" height="240" rx="14" fill="url(#haze)"/>

  <!-- distant stars -->
  <circle class="star" cx="40" cy="28" r="1.2"/><circle class="star d1" cx="120" cy="70" r="1"/>
  <circle class="star d2" cx="210" cy="20" r="1.4"/><circle class="star d3" cx="300" cy="48" r="1"/>
  <circle class="star d1" cx="560" cy="18" r="1.3"/><circle class="star d2" cx="640" cy="60" r="1"/>
  <circle class="star d3" cx="720" cy="30" r="1.5"/><circle class="star" cx="770" cy="80" r="1"/>
  <circle class="star d2" cx="80" cy="140" r="1"/><circle class="star d1" cx="180" cy="190" r="1.2"/>

  <!-- planet with shadowed limb -->
  <clipPath id="disk"><circle cx="420" cy="100" r="74"/></clipPath>
  <circle cx="420" cy="100" r="74" fill="url(#planet)"/>
  <circle cx="452" cy="124" r="74" fill="#0a0f24" opacity=".35" clip-path="url(#disk)"/>

  <!-- asteroid belt: negative delays spread them across the frame from the start -->
  <g>
    <path class="rock" style="animation-duration:38s;animation-delay:-2s" d="M820 120 l7 -4 l6 3 l1 7 l-6 5 l-8 -2 z"/>
    <path class="rock" style="animation-duration:46s;animation-delay:-9s" d="M840 150 l4 -3 l4 2 l0 5 l-5 2 z"/>
    <path class="rock" style="animation-duration:34s;animation-delay:-14s" d="M860 100 l9 -5 l8 4 l2 9 l-8 6 l-10 -3 z"/>
    <path class="rock" style="animation-duration:52s;animation-delay:-21s" d="M830 175 l3 -2 l3 2 l-1 4 l-4 0 z"/>
    <path class="rock" style="animation-duration:40s;animation-delay:-27s" d="M850 135 l6 -3 l5 3 l0 6 l-6 3 l-5 -3 z"/>
    <path class="rock" style="animation-duration:44s;animation-delay:-33s" d="M825 200 l5 -3 l5 3 l-1 5 l-6 1 z"/>
    <path class="rock" style="animation-duration:36s;animation-delay:-5s" d="M870 165 l4 -2 l4 3 l-2 4 l-5 -1 z"/>
    <path class="rock" style="animation-duration:48s;animation-delay:-17s" d="M845 90 l3 -2 l3 2 l-1 3 l-4 0 z"/>
    <path class="rock" style="animation-duration:42s;animation-delay:-38s" d="M835 215 l7 -4 l6 4 l-1 7 l-8 1 z"/>
  </g>

  <!-- rail and train, drawn flat then tilted into a climb -->
  <g transform="translate(470 150) rotate(-14)">
    <rect x="-560" y="15" width="776" height="3.5" fill="url(#trail)"/>
    <rect x="-560" y="9" width="776" height="16" rx="8" fill="url(#trail)" opacity=".3"/>
    <rect x="200" y="17" width="260" height="1.5" fill="url(#ahead)"/>

    <g transform="translate(60 4) scale(1.4)">
      <circle class="spark" cx="-60" cy="18" r="1.6"/>
      <circle class="spark" cx="-60" cy="14" r="1.1" style="animation-delay:-.3s"/>
      <circle class="spark" cx="-60" cy="22" r="1.3" style="animation-delay:-.6s"/>
      <circle class="spark" cx="-60" cy="12" r="1" style="animation-delay:-.9s"/>
      <circle class="spark" cx="-60" cy="20" r="1.8" style="animation-delay:-1.2s"/>
      <circle class="spark" cx="-60" cy="16" r="1.2" style="animation-delay:-1.5s"/>
      <circle class="spark" cx="40" cy="19" r="1.4" style="animation-delay:-.15s"/>
      <circle class="spark" cx="40" cy="13" r="1" style="animation-delay:-.75s"/>
      <circle class="spark" cx="40" cy="23" r="1.2" style="animation-delay:-1.35s"/>
      <circle class="spark" cx="140" cy="17" r="1.5" style="animation-delay:-.45s"/>
      <circle class="spark" cx="140" cy="21" r="1" style="animation-delay:-1.05s"/>
      <circle class="spark" cx="140" cy="15" r="1.3" style="animation-delay:-1.65s"/>
    </g>

    <g class="train">
      <!-- carriages -->
      <g fill="url(#body)" stroke="#5c6680" stroke-width="1">
        <rect x="-330" y="-6" width="104" height="20" rx="3"/>
        <rect x="-222" y="-6" width="104" height="20" rx="3"/>
        <rect x="-114" y="-6" width="104" height="20" rx="3"/>
        <rect x="-6" y="-6" width="104" height="20" rx="3"/>
      </g>
      <g class="win">
        <rect x="-320" y="-1" width="12" height="6" rx="1"/><rect x="-298" y="-1" width="12" height="6" rx="1"/><rect x="-276" y="-1" width="12" height="6" rx="1"/><rect x="-254" y="-1" width="12" height="6" rx="1"/>
        <rect x="-212" y="-1" width="12" height="6" rx="1"/><rect x="-190" y="-1" width="12" height="6" rx="1"/><rect x="-168" y="-1" width="12" height="6" rx="1"/><rect x="-146" y="-1" width="12" height="6" rx="1"/>
        <rect x="-104" y="-1" width="12" height="6" rx="1"/><rect x="-82" y="-1" width="12" height="6" rx="1"/><rect x="-60" y="-1" width="12" height="6" rx="1"/><rect x="-38" y="-1" width="12" height="6" rx="1"/>
        <rect x="4" y="-1" width="12" height="6" rx="1"/><rect x="26" y="-1" width="12" height="6" rx="1"/><rect x="48" y="-1" width="12" height="6" rx="1"/><rect x="70" y="-1" width="12" height="6" rx="1"/>
      </g>
      <!-- locomotive with a long tapered nose -->
      <path d="M102 -12 h70 l46 14 l-6 12 h-110 z" fill="url(#body)" stroke="#c9a86a" stroke-width="1.2"/>
      <rect x="112" y="-6" width="26" height="8" rx="1.5" class="win"/>
      <path d="M150 -12 h22 l46 14 h-20 z" fill="#c9a86a" opacity=".35"/>
      <!-- headlight -->
      <circle class="flare" cx="214" cy="2" r="18" fill="url(#flare)"/>
    </g>
  </g>
</svg>
